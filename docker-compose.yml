services:
  backend:
    build:
      context: ./e-resto-backend
      dockerfile: Dockerfile
    container_name: e_resto_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./e-resto-backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - e_resto_network

  nginx:
    image: nginx:latest
    container_name: e_resto_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./e-resto-backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - e_resto_network

  client:
    build:
      context: ./e-resto-Angular
      dockerfile: Dockerfile
    container_name: e_resto_client
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./e-resto-Angular:/app
      - /app/node_modules
    networks:
      - e_resto_network

  admin:
    build:
      context: ./e-resto-admin
      dockerfile: Dockerfile
    container_name: e_resto_admin
    restart: unless-stopped
    ports:
      - "4201:4200"
    volumes:
      - ./e-resto-admin:/app
      - /app/node_modules
    networks:
      - e_resto_network

  platform:
    build:
      context: ./e-resto-platform-Angular
      dockerfile: Dockerfile
    container_name: e_resto_platform
    restart: unless-stopped
    ports:
      - "4202:4200"
    volumes:
      - ./e-resto-platform-Angular:/app
      - /app/node_modules
    networks:
      - e_resto_network

  resto_client:
    build:
      context: ./e-resto-client
      dockerfile: Dockerfile
    container_name: e_resto_react_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./e-resto-client:/app
      - /app/node_modules
    networks:
      - e_resto_network

  mysql:
    image: mysql:8.0
    container_name: e_resto_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e_resto
      MYSQL_USER: e_resto
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - e_resto_network

  redis:
    image: redis:alpine
    container_name: e_resto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - e_resto_network

volumes:
  mysql_data:

networks:
  e_resto_network:
    driver: bridge