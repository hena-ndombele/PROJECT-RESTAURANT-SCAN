<div class="container-fluid p-0 overflow-hidden">
    <div class="row min-vh-100 g-0">

        <div class="col-lg-7 d-none d-lg-flex flex-column align-items-center justify-content-center bg-light p-5 position-relative"
             style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('assets/images/image10.jpg') center/cover;">

            <div class="text-center text-white p-4" style="z-index: 2;">
                <img src="assets/logo/e-resto-logo.png" alt="Logo" width="150" height="96"
                     class="mb-4" style="border-radius: 0; border: 3px solid white; object-fit: contain;">

                <h6 class="display-4 fw-bold mb-1" style="font-size: 32px">The digital menu, simplified management.</h6>
                <br/>
                <br/>
                <p class="fs-5 opacity-75">
                    Transform each table into a digital point of sale. Access your interface to manage your services via QR code.
                </p>
            </div>
        </div>

        <div class="col-lg-5 d-flex align-items-center justify-content-center bg-white p-4">
            <div class="w-100" style="max-width: 450px;">
                <div class="card" style="max-width:420px; width:100%;">
                    <div class="card-body p-5">

                        <div class="card auth-card  border-0">
                            <div class="card-body p-4 p-sm-5">

                                <div class="text-center mb-4">
                                    <a routerLink="/" class="d-inline-block mb-3">
                                        <img src="assets/logo/e-resto-logo.png"
                                             alt="Logo"
                                             width="110"
                                             height="70"
                                             class="logo-shadow" style="border-radius: 0; border: 2px solid black; object-fit: contain;">
                                    </a>
                                    <h1 class="h4 fw-bold text-dark">LOG IN</h1>
                                    <p class="text-muted small">Please enter your details to sign in</p>
                                </div>

                                <form class="needs-validation" (ngSubmit)="login()" #loginForm="ngForm" novalidate>

                                    <div class="mb-3">
                                        <label for="email" class="form-label small fw-semibold">Email Address <span style="color:red">*</span></label>
                                        <input
                                                id="email"
                                                type="email"
                                                class="form-control custom-input"
                                                placeholder="Enter your address mail"
                                                required
                                                [(ngModel)]="email"
                                                name="email"
                                                #emailInput="ngModel"
                                                autocomplete="false"
                                        />
                                        <div class="invalid-feedback d-block" *ngIf="emailInput.invalid && emailInput.touched">
                                            A valid email is required.
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label small fw-semibold">Password <span style="color:red">*</span></label>
                                        <div class="input-group">
                                            <input
                                                    id="password"
                                                    [type]="showPassword ? 'text' : 'password'"
                                                    class="form-control custom-input border-end-0"
                                                    placeholder="Enter your password"
                                                    required
                                                    minlength="6"
                                                    [(ngModel)]="password"
                                                    name="password"
                                                    #passwordInput="ngModel"
                                                    autocomplete="new-password"
                                            />
                                            <button
                                                    class="btn btn-outline-light border border-start-0 text-muted bg-white"
                                                    type="button"
                                                    (click)="togglePasswordVisibility()">
                                                <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                            </button>
                                        </div>
                                        <div class="invalid-feedback d-block" *ngIf="passwordInput.invalid && passwordInput.touched">
                                            Password must be at least 6 characters.
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input id="remember" class="form-check-input" type="checkbox" />
                                            <label class="form-check-label small text-secondary" for="remember">
                                                Stay signed in
                                            </label>
                                        </div>

                                    </div>

                                    <button class="btn  w-100 py-2 fw-bold d-flex align-items-center justify-content-center "
                                            type="submit"
                                            [disabled]="loginForm.invalid || isLoading" style="background: #F9A11B">
                                        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                                        <span>{{ isLoading ? 'Authenticating...' : 'Sign In' }}</span>
                                        <i *ngIf="!isLoading" class="bi bi-arrow-right-short ms-1 fs-5"></i>
                                    </button>
                                </form>

                            </div>
                        </div>

                    </div>

                <span style="font-size: 11px;"><app-footer></app-footer></span>
                </div>
            </div>

        </div>


    </div>
</div>
