<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-2">
        <div>
            <h1 class="fs-3 fw-black text-uppercase mb-1">Update Dish</h1>
            <p class="mb-0 text-muted small">E-RESTO ADMIN > MENU MANAGEMENT</p>
        </div>
        <button type="button" class="btn btn-outline-dark rounded-0 px-3" onclick="history.back()">
            <i class="ti ti-arrow-left me-1"></i> BACK
        </button>
    </div>

    @if (isLoadingDish()) {
        <div class="text-center py-5">
            <div class="spinner-border text-dark rounded-0" role="status"></div>
            <p class="mt-2 fw-bold text-uppercase">Loading dish...</p>
        </div>
    } @else if (errorMessage) {
        <div class="alert alert-danger rounded-0 border-2 fw-bold text-uppercase" role="alert">
            {{ errorMessage }}
        </div>
    } @else {
        <form [formGroup]="dishForm" (ngSubmit)="onSubmit()">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card shadow-sm border-2 rounded-0">
                        <div class="card-header bg-white py-3 border-bottom border-2">
                            <h5 class="mb-0 fw-bold text-uppercase">Product Details</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label class="form-label fw-bold small text-uppercase">Name <span style="color:red">*</span></label>
                                    <input type="text" class="form-control rounded-0 border-2" formControlName="name">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-bold small text-uppercase">Category <span style="color:red">*</span></label>
                                    <select formControlName="category_id" class="form-select rounded-0 border-2">
                                        <option value="" disabled>Choose...</option>
                                        <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.name }}</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-bold small text-uppercase">Description <span style="color:red">*</span></label>
                                    <textarea class="form-control rounded-0 border-2" formControlName="description" rows="4"></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-uppercase">Price <span style="color:red">*</span></label>
                                    <div class="input-group">
                                        <input type="number" class="form-control rounded-0 border-2" formControlName="price">
                                        <select class="form-select rounded-0 border-2 flex-grow-0" style="width: 100px;" formControlName="currency">
                                            <option value="CDF">CDF</option>
                                            <option value="USD">USD</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-bold small text-uppercase">Time (Min)</label>
                                    <input type="number" class="form-control rounded-0 border-2" formControlName="preparation_time">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-bold small text-uppercase">Stock</label>
                                    <div class="form-check form-switch p-2 ps-5 border border-2 rounded-0 bg-light">
                                        <input class="form-check-input" type="checkbox" formControlName="is_available" id="stockStatus">
                                        <label class="form-check-label fw-bold text-uppercase" for="stockStatus">available</label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-bold small text-uppercase">Ingredients</label>
                                    <div class="tag-input-container form-control rounded-0 border-2 d-flex flex-wrap gap-2 p-2">
                                        <span *ngFor="let ing of ingredients; let i = index" class="badge bg-black text-white rounded-0 py-2 px-3">
                                            {{ ing | uppercase }}
                                            <i class="ti ti-x ms-2 cursor-pointer" (click)="removeIngredient(i)"></i>
                                        </span>
                                        <input type="text" (keydown.enter)="addIngredient($event)" class="border-0 flex-grow-1" style="outline: none;" placeholder="Add...">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card shadow-sm border-2 rounded-0 mb-4">
                        <div class="card-header bg-white py-3 border-bottom border-2">
                            <h5 class="mb-0 fw-bold text-uppercase">Dish Media</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-warning">Main Image</label>
                                <div class="preview-box border-2 border-dashed bg-light mb-2 d-flex align-items-center justify-content-center overflow-hidden" style="height: 220px;">
                                    <img *ngIf="previewUrl" [src]="previewUrl" class="img-fluid h-100 w-100 object-fit-cover">
                                    <i *ngIf="!previewUrl" class="ti ti-photo-plus fs-1 text-muted"></i>
                                </div>
                                <input type="file" (change)="onFileChange($event, 'main')" class="form-control rounded-0 border-2" accept="image/*">
                            </div>

                            <div class="row g-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold x-small text-uppercase">Image 1</label>
                                    <div class="preview-secondary border border-2 bg-light mb-2 d-flex align-items-center justify-content-center overflow-hidden" style="height: 100px;">
                                        <img *ngIf="thumb1Preview" [src]="thumb1Preview" class="img-fluid h-100 w-100 object-fit-cover">
                                        <i *ngIf="!thumb1Preview" class="ti ti-camera-plus text-muted fs-4"></i>
                                    </div>
                                    <input type="file" (change)="onFileChange($event, 'thumb1')" class="form-control form-control-sm rounded-0 border-2" accept="image/*">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold x-small text-uppercase">Image 2</label>
                                    <div class="preview-secondary border border-2 bg-light mb-2 d-flex align-items-center justify-content-center overflow-hidden" style="height: 100px;">
                                        <img *ngIf="thumb2Preview" [src]="thumb2Preview" class="img-fluid h-100 w-100 object-fit-cover">
                                        <i *ngIf="!thumb2Preview" class="ti ti-camera-plus text-muted fs-4"></i>
                                    </div>
                                    <input type="file" (change)="onFileChange($event, 'thumb2')" class="form-control form-control-sm rounded-0 border-2" accept="image/*">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning py-3 fw-black rounded-0 text-black shadow-sm d-flex align-items-center justify-content-center" [disabled]="dishForm.invalid || isLoading()">
                            <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2"></span>
                            <i class="bi bi-check-circle me-1"></i> {{ isLoading() ? 'IN PROGRESS...' : 'SAVE CHANGES' }}
                        </button>
                        <button type="button" class="btn btn-secondary py-2 fw-bold rounded-0 border border-2" onclick="history.back()">
                            <i class="bi bi-x-circle me-1"></i> CANCEL
                        </button>
                    </div>
                </div>
            </div>
        </form>
    }
</div>
