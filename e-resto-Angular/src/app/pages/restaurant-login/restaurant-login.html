<main class="auth-page">
  <aside class="auth-visual">
    <img class="auth-photo" src="assets/images/image12.jfif" alt="QR code menu digital Restaura Scan">
    <a class="visual-brand" routerLink="/">
      <img src="assets/logo/e-resto-logo.png" alt="Restaura Scan">
      <span>Restaura Scan</span>
    </a>
    <div class="visual-copy">
      <span>Restaurant SaaS</span>
      <h2>Pilotez votre restaurant depuis un espace clair.</h2>
      <p>Menu QR, commandes, tables et rapports restent accessibles au meme endroit.</p>
    </div>
  </aside>

  <section class="auth-panel">
    <div class="auth-card">
      <a class="form-logo" routerLink="/" aria-label="Retour a l'accueil">
        <img src="assets/logo/e-resto-logo.png" alt="Restaura Scan">
      </a>
      <h1>Se connecter</h1>
      <p class="intro">Connectez-vous pour reprendre le pilotage de votre restaurant.</p>

      <form (ngSubmit)="login()" novalidate>
        <label>
          <span>Adresse email</span>
          <input [(ngModel)]="email" name="email" type="email" placeholder="nom@email.com" autocomplete="email" required>
        </label>
        <label>
          <span>Mot de passe</span>
          <input [(ngModel)]="password" name="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
        </label>
        <button class="primary-action" type="submit" [disabled]="loading">
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
        <p class="message" role="alert" *ngIf="message"><i class="bi bi-exclamation-triangle-fill"></i>{{ message }}</p>
      </form>

      <p class="switch-link">Pas encore de compte ? <a routerLink="/pricing">Choisir un plan</a></p>
    </div>
  </section>
</main>
