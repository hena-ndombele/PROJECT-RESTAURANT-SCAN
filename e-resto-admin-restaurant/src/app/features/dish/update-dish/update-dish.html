<div class="container-fluid py-4 update-dish-page">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-2">
        <div>
            <h1 class="fs-3 fw-black text-uppercase mb-1">Mettre à jour le plat</h1>
            <p class="mb-0 text-muted small">Restaurant Scan > Gestion des menus</p>
        </div>
        <button type="button" class="btn dish-back-btn" onclick="history.back()">
            <i class="ti ti-arrow-left me-1"></i> Retour
        </button>
    </div>

    @if (isLoadingDish()) {
        <div class="text-center py-5">
            <div class="spinner-border text-dark rounded-0" role="status"></div>
            <p class="mt-2 fw-bold text-uppercase">Chargement du plat...</p>
        </div>
    } @else if (errorMessage) {
        <div class="alert alert-danger rounded-0 border-2 fw-bold text-uppercase" role="alert">
            {{ errorMessage }}
        </div>
    } @else {
        <form [formGroup]="dishForm" (ngSubmit)="onSubmit()">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card shadow-sm border-2 rounded-0">
                        <div class="card-header bg-white py-3 border-bottom border-2">
                            <h5 class="mb-0 fw-bold text-uppercase">Détails du produit</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label class="form-label fw-bold small text-uppercase">Nom<span style="color:red">*</span></label>
                                    <input type="text" class="form-control rounded-0 border-2" formControlName="name">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-bold small text-uppercase">Categorie<span style="color:red">*</span></label>
                                    <select formControlName="category_id" class="form-select rounded-0 border-2">
                                        <option value="" disabled>Choisir...</option>
                                        <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.name }}</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-bold small text-uppercase">Description <span style="color:red">*</span></label>
                                    <textarea class="form-control rounded-0 border-2" formControlName="description" rows="4"></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-uppercase">Prix <span style="color:red">*</span></label>
                                    <div class="input-group">
                                        <input type="number" class="form-control rounded-0 border-2" formControlName="price">
                                        <select class="form-select rounded-0 border-2 flex-grow-0" style="width: 100px;" formControlName="currency">
                                            <option value="CDF">CDF</option>
                                            <option value="USD">USD</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-bold small text-uppercase">Temps (Min)</label>
                                    <input type="number" class="form-control rounded-0 border-2" formControlName="preparation_time">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-bold small text-uppercase">Stock</label>
                                    <div class="form-check form-switch p-2 ps-5 border border-2 rounded-0 bg-light">
                                        <input class="form-check-input" type="checkbox" formControlName="is_available" id="stockStatus">
                                        <label class="form-check-label fw-bold text-uppercase" for="stockStatus">disponible</label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-bold small text-uppercase">Ingrédients</label>
                                    <div class="tag-input-container form-control rounded-0 border-2 d-flex flex-wrap gap-2 p-2">
                                        <span *ngFor="let ing of ingredients; let i = index" class="badge bg-black text-white rounded-0 py-2 px-3">
                                            {{ ing | uppercase }}
                                            <i class="ti ti-x ms-2 cursor-pointer" (click)="removeIngredient(i)"></i>
                                        </span>
                                        <input type="text" (keydown.enter)="addIngredient($event)" class="border-0 flex-grow-1" style="outline: none;" placeholder="Ajouter un ingrédient...">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-bold small text-uppercase">
                                        Tailles disponibles <span class="text-muted">(optionnel)</span>
                                    </label>
                                    <div class="dish-size-options">
                                        <label *ngFor="let size of sizeOptions" class="dish-size-option">
                                            <input type="checkbox"
                                                   [checked]="hasSize(size.value)"
                                                   (change)="toggleSize(size.value, $any($event.target).checked)">
                                            <span>{{ size.label }}</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="col-12" *ngIf="canUseDishPromotions()">
                                    <div class="border border-2 rounded-0 p-3 bg-light">
                                        <div class="form-check form-switch mb-3">
                                            <input class="form-check-input" type="checkbox" formControlName="promotion_enabled" id="promotionEnabled">
                                            <label class="form-check-label fw-bold text-uppercase small" for="promotionEnabled">Plat en promotion</label>
                                        </div>
                                        <div class="row g-3" *ngIf="dishForm.get('promotion_enabled')?.value">
                                            <div class="col-md-6">
                                                <label class="form-label fw-bold small text-uppercase">Remise (%)</label>
                                                <input type="number" min="1" max="95" class="form-control rounded-0 border-2" formControlName="promotion_percent" placeholder="Ex: 20">
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-bold small text-uppercase">Fin de la promo</label>
                                                <input type="date" class="form-control rounded-0 border-2" formControlName="promotion_ends_at">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card shadow-sm border-2 rounded-0 mb-4">
                        <div class="card-header bg-white py-3 border-bottom border-2">
                            <h5 class="mb-0 fw-bold text-uppercase">Plat Média</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-warning">Image Principale</label>
                                <div class="preview-box border-2 border-dashed bg-light mb-2 d-flex align-items-center justify-content-center overflow-hidden" style="height: 220px;">
                                    <img *ngIf="previewUrl" [src]="previewUrl" class="img-fluid h-100 w-100 object-fit-cover">
                                    <i *ngIf="!previewUrl" class="ti ti-photo-plus fs-1 text-muted"></i>
                                </div>
                                <input type="file" (change)="onFileChange($event, 'main')" class="form-control rounded-0 border-2" accept="image/*">
                            </div>

                            <div class="row g-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold x-small text-uppercase">Image 1</label>
                                    <div class="preview-secondary border border-2 bg-light mb-2 d-flex align-items-center justify-content-center overflow-hidden" style="height: 100px;">
                                        <img *ngIf="thumb1Preview" [src]="thumb1Preview" class="img-fluid h-100 w-100 object-fit-cover">
                                        <i *ngIf="!thumb1Preview" class="ti ti-camera-plus text-muted fs-4"></i>
                                    </div>
                                    <input type="file" (change)="onFileChange($event, 'thumb1')" class="form-control form-control-sm rounded-0 border-2" accept="image/*">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold x-small text-uppercase">Image 2</label>
                                    <div class="preview-secondary border border-2 bg-light mb-2 d-flex align-items-center justify-content-center overflow-hidden" style="height: 100px;">
                                        <img *ngIf="thumb2Preview" [src]="thumb2Preview" class="img-fluid h-100 w-100 object-fit-cover">
                                        <i *ngIf="!thumb2Preview" class="ti ti-camera-plus text-muted fs-4"></i>
                                    </div>
                                    <input type="file" (change)="onFileChange($event, 'thumb2')" class="form-control form-control-sm rounded-0 border-2" accept="image/*">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="dish-form-actions">
                        <button type="submit" class="btn dynamic-primary dish-action-btn fw-black rounded-0 text-black shadow-sm d-flex align-items-center justify-content-center" [disabled]="dishForm.invalid || isLoading()">
                            <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2"></span>
                            <i class="bi bi-check-circle me-1"></i> {{ isLoading() ? 'EN COURS...' : 'SAUVEGARDER LES CHANGEMENTS' }}
                        </button>
                        <button type="button" class="btn btn-secondary dish-action-btn fw-bold rounded-0 border border-2" onclick="history.back()">
                            <i class="bi bi-x-circle me-1"></i> ANNULER
                        </button>
                    </div>
                </div>
            </div>
        </form>
    }
</div>
