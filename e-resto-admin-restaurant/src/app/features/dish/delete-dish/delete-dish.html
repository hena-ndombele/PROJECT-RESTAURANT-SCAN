

<button class="dish-delete-btn" title="Supprimer" data-bs-toggle="modal"
        [attr.data-bs-target]="'#deleteDishModal' +dishId">
    <i class="ti ti-trash"></i>
</button>


<div class="modal fade" [id]="'deleteDishModal' +dishId " tabindex="-1"
     aria-labelledby="deleteCategoryModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header border-bottom-0 pb-0">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4 text-center">
                <div class="mb-3">
                    <i class="ti ti-alert-circle text-danger" style="font-size: 4rem;"></i>
                </div>

                <h4 class="fw-bolder">Supprimer ce menu ?</h4>
                <p class="text-muted text-wrap text-break px-2">
                    Cette action est irreversible. Toutes les données relative à ce menu seront supprimées de manière permanente.
                </p>
            </div>

            <div class="modal-footer border-top-0 d-flex justify-content-center gap-3 pb-4">
                <button type="reset" class="btn btn-secondary d-flex align-items-center" data-bs-dismiss="modal">
                    <i class="ti ti-x me-2 fs-4"></i>
                    Annuler
                </button>

                <button type="button"
                        class="btn btn-danger px-4 shadow-sm d-flex align-items-center"
                        (click)="onDelete(dishId!)"
                        [disabled]="isLoading">

                    @if (isLoading) {
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        <span>Suppression en cours...</span>
                    } @else {
                        <i class="ti ti-trash me-2 fs-4"></i>
                        <span>Supprimer</span>
                    }
                </button>
            </div>

        </div>
    </div>
</div>
