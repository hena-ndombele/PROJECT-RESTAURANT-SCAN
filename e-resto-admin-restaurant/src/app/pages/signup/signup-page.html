<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card" style="max-width:420px; width:100%;">
    <div class="card-body p-5">
      <div class="text-center mb-3">
        <a routerLink="/" class="mb-4 d-inline-block"><img src="assets/images/logo-icon.svg" alt="" width="36"><span class="ms-2"><img src="assets/images/logo.svg" alt=""></span></a>
        <h1 class="card-title mb-5 h5">Create your account</h1>
      </div>
      <form class="needs-validation mt-3" novalidate>
        <div class="mb-3"><label for="fullName" class="form-label">Full name</label><input id="fullName" type="text" class="form-control" placeholder="Jane Doe" required><div class="invalid-feedback">Please enter your name.</div></div>
        <div class="mb-3"><label for="signupEmail" class="form-label">Email address</label><input id="signupEmail" type="email" class="form-control" placeholder="name@example.com" required><div class="invalid-feedback">Please enter a valid email.</div></div>
        <div class="mb-3"><label for="signupPassword" class="form-label">Password</label><input id="signupPassword" type="password" class="form-control" placeholder="Create a password" required minlength="6"><div class="invalid-feedback">Please provide a password (min 6 characters).</div></div>
        <div class="mb-3"><label for="confirmPassword" class="form-label">Confirm password</label><input id="confirmPassword" type="password" class="form-control" placeholder="Repeat password" required><div class="invalid-feedback">Passwords must match.</div></div>
        <div class="mb-3 form-check"><input id="terms" class="form-check-input" type="checkbox" required><label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-decoration-none">terms and privacy</a></label><div class="invalid-feedback">You must agree before continuing.</div></div>
        <button class="btn btn-primary w-100" type="submit">Sign up</button>
      </form>
      <div class="text-center mt-3 small text-muted">Already have an account? <a routerLink="/signin" class="link-primary">Sign in</a></div>
    </div>
  </div>
</div>
