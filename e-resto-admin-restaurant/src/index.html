<!doctype html>
<html lang="fr">
<head>

    <title>
        Restaurant Scan | Menu digital et gestion de restaurant
    </title>

    <base href="/">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta

    <meta
        name="robots"
        content="index, follow, max-image-preview:large"
    >

    <meta name="author" content="Restaurant Scan">
    <meta name="application-name" content="Restaurant Scan">
    <meta name="theme-color" content="#111318">

    <!-- URL officielle de la page -->
    <link
        rel="canonical"
        href="https://restaurant.restaurascan.com/"
    >

    <!-- Open Graph : Facebook, LinkedIn et WhatsApp -->
    <meta property="og:type" content="website">

    <meta
        property="og:title"
        content="Restaurant Scan | Menu digital et gestion de restaurant"
    >

    <meta
        property="og:description"
        content="Créez votre menu digital, recevez des commandes 
        par QR Code et gérez votre restaurant avec Restaurant Scan."
    >

    <meta
        property="og:url"
        content="https://restaurant.restaurascan.com/"
    >

    <meta
        property="og:image"
        content="https://restaurant.restaurascan.com/assets/landing/qr-scan-phone.png"
    >

    <meta property="og:site_name" content="Restaurant Scan">
    <meta property="og:locale" content="fr_FR">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">

    <meta
        name="twitter:title"
        content="Restaurant Scan | Menu digital et gestion de restaurant"
    >

    <meta
        name="twitter:description"
        content="Créez votre menu digital, recevez des commandes par QR Code et gérez votre restaurant avec Restaurant Scan."
    >

    <meta
        name="twitter:image"
        content="https://restaurant.restaurascan.com/assets/landing/qr-scan-phone.png"
    >

    <!-- Icônes -->
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="assets/logo/e-resto-logo-192.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="assets/logo/e-resto-logo.png"
    >

    <link
        rel="manifest"
        href="assets/images/favicon_io/site.webmanifest"
    >

    <!-- Données structurées Google -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Restaurant Scan",
        "url": "https://restaurant.restaurascan.com/",
        "description": "Plateforme SaaS permettant aux restaurants de créer un menu digital, recevoir des commandes par QR Code et gérer leur établissement.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "fr",
        "publisher": {
            "@type": "Organization",
            "name": "Restaurant Scan",
            "url": "https://restaurant.restaurascan.com/",
            "logo": {
                "@type": "ImageObject",
                "url": "https://restaurant.restaurascan.com/assets/logo/e-resto-logo-192.png"
            }
        }
    }

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
