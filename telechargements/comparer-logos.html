<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparer les logos</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      background: #fff7ef;
      color: #111318;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0 0 22px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      max-width: 1160px;
      margin: 0 auto;
    }

    article {
      padding: 18px;
      border: 1px solid rgba(17, 19, 24, .12);
      border-radius: 12px;
      background: #fff;
      text-align: center;
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #fff;
    }

    h2 {
      margin: 14px 0 10px;
      font-size: 18px;
    }

    a {
      display: inline-flex;
      margin-top: 8px;
      padding: 12px 16px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #ff7a1a, #d71920);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Comparaison des logos Restaura Scan</h1>
  <div class="grid">
    <article>
      <img src="restaura-scan-gradient-logo.png" alt="Logo actuel Restaura Scan">
      <h2>Version actuelle</h2>
      <a href="restaura-scan-gradient-logo.png" download>Telecharger</a>
    </article>
    <article>
      <img src="restaura-scan-gradient-background-logo.png" alt="Logo fond degrade Restaura Scan">
      <h2>Fond degrade + texte blanc</h2>
      <a href="restaura-scan-gradient-background-logo.png" download>Telecharger</a>
    </article>
  </div>
</body>
</html>
