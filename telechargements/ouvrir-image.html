<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telecharger le logo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 20px;
      padding: 28px;
      background: #fff7ef;
      color: #111318;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(980px, 100%);
      text-align: center;
    }

    img {
      width: 100%;
      max-width: 820px;
      height: auto;
      border: 1px solid rgba(17, 19, 24, .1);
      border-radius: 12px;
      background: #fff;
    }

    a {
      display: inline-flex;
      margin-top: 18px;
      padding: 14px 20px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #ff7a1a, #d71920);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="restaura-scan-gradient-logo.png" alt="Logo Restaurant Scan recolorise">
    <br>
    <a href="restaura-scan-gradient-logo.png" download>Telecharger l'image</a>
  </main>
</body>
</html>
