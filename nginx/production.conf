server {
    listen 80;
    server_name api.restaurascan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name admin.restaurascan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name restaurascan.com www.restaurascan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.restaurascan.com;

    root /var/www/e-resto-backend/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/api.restaurascan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.restaurascan.com/privkey.pem;

    client_max_body_size 32M;

    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.restaurascan.com;

    root /var/www/e-resto-admin-restaurant/dist/inapp/browser;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/admin.restaurascan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.restaurascan.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name restaurascan.com www.restaurascan.com;

    root /var/www/e-resto-client/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/restaurascan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurascan.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
