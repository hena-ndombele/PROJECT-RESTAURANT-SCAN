server {
    listen 80;
    server_name api.restaurascan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name admin.restaurascan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name restaurant.restaurascan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name restaurascan.com www.restaurascan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.restaurascan.com;
    server_tokens off;

    root /var/www/e-resto-backend/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/api.restaurascan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.restaurascan.com/privkey.pem;

    client_max_body_size 32M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.restaurascan.com https://admin.restaurascan.com https://restaurant.restaurascan.com https://restaurascan.com; font-src 'self' data:; connect-src 'self' https://api.restaurascan.com wss://api.restaurascan.com; upgrade-insecure-requests" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), usb=()" always;

    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

